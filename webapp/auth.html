<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智能日报看板 · 登录</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f9fafb;
  --ink:#161b22; --muted:#5c6675; --border:#e4e8ee;
  --accent:#2f6fed; --accent-ink:#ffffff; --accent-weak:rgba(47,111,237,.10);
  --danger:#d64545;
  --radius-card:10px; --radius-ctl:8px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--ink);
  font:14px/1.6 "Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  padding:24px;
}
.wrap{width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;justify-content:center}
.brand svg{color:var(--accent)}
.brand h1{font-size:17px;margin:0;font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow);padding:26px 26px 24px}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-ctl);padding:4px;margin-bottom:20px}
.tab{flex:1;text-align:center;padding:7px 0;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted);border:none;background:none;font:inherit;font-size:13px}
.tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
form{display:none;flex-direction:column;gap:12px}
form.active{display:flex}
label{font-size:13px;color:var(--muted);font-weight:600}
input{border:1px solid var(--border);background:var(--surface-2);color:var(--ink);border-radius:var(--radius-ctl);padding:10px 12px;font:inherit;font-size:14px;width:100%}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:var(--radius-ctl);padding:10px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}
button:hover{filter:brightness(1.06)}
.msg{display:none;border-radius:var(--radius-ctl);padding:9px 12px;font-size:13px}
.msg.err{display:block;color:var(--danger);background:rgba(214,69,69,.10)}
.hint{margin-top:16px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    <h1>智能日报看板</h1>
  </div>
  <div class="card">
    <div class="tabs">
      <button type="button" class="tab active" id="tabLogin">登录</button>
      <button type="button" class="tab" id="tabRegister">注册</button>
    </div>
    <form id="loginForm" class="active">
      <div class="msg" id="loginMsg"></div>
      <label for="loginUser">用户名</label>
      <input id="loginUser" autocomplete="username" required>
      <label for="loginPass">密码</label>
      <input id="loginPass" type="password" autocomplete="current-password" required>
      <button type="submit">登录</button>
    </form>
    <form id="registerForm">
      <div class="msg" id="regMsg"></div>
      <label for="regUser">用户名（1-32 个字符）</label>
      <input id="regUser" autocomplete="username" required>
      <label for="regPass">密码（至少 6 位）</label>
      <input id="regPass" type="password" autocomplete="new-password" required>
      <label for="regPass2">确认密码</label>
      <input id="regPass2" type="password" autocomplete="new-password" required>
      <button type="submit">注册并登录</button>
    </form>
  </div>
  <p class="hint">智能日报生成器 · 数据仅保存在本机</p>
</div>
<script>
(function () {
  var tabLogin = document.getElementById("tabLogin");
  var tabRegister = document.getElementById("tabRegister");
  var loginForm = document.getElementById("loginForm");
  var registerForm = document.getElementById("registerForm");

  function showLogin() {
    tabLogin.classList.add("active");
    tabRegister.classList.remove("active");
    loginForm.classList.add("active");
    registerForm.classList.remove("active");
  }
  function showRegister() {
    tabRegister.classList.add("active");
    tabLogin.classList.remove("active");
    registerForm.classList.add("active");
    loginForm.classList.remove("active");
  }
  tabLogin.addEventListener("click", showLogin);
  tabRegister.addEventListener("click", showRegister);

  function showMsg(el, text) {
    el.textContent = text;
    el.classList.add("err");
  }

  // 已登录则直接进入看板
  fetch("api/reports").then(function (resp) {
    if (resp.status === 200) { location.href = "/"; }
  }).catch(function () {});

  loginForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var msg = document.getElementById("loginMsg");
    msg.classList.remove("err");
    fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("loginUser").value,
        password: document.getElementById("loginPass").value
      })
    }).then(function (resp) {
      return resp.json().then(function (data) { return { ok: resp.ok, data: data }; });
    }).then(function (r) {
      if (r.ok && r.data.code === 0) { location.href = "/"; }
      else { showMsg(msg, (r.data && r.data.msg) || "登录失败"); }
    }).catch(function () { showMsg(msg, "网络错误，请重试"); });
  });

  registerForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var msg = document.getElementById("regMsg");
    msg.classList.remove("err");
    var pass = document.getElementById("regPass").value;
    if (pass !== document.getElementById("regPass2").value) {
      showMsg(msg, "两次输入的密码不一致");
      return;
    }
    fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("regUser").value,
        password: pass
      })
    }).then(function (resp) {
      return resp.json().then(function (data) { return { ok: resp.ok, data: data }; });
    }).then(function (r) {
      if (r.ok && r.data.code === 0) { location.href = "/"; }
      else { showMsg(msg, (r.data && r.data.msg) || "注册失败"); }
    }).catch(function () { showMsg(msg, "网络错误，请重试"); });
  });
})();
</script>
</body>
</html>
