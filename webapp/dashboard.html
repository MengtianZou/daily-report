<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>研发一组 · 日报看板</title>
<script>try{var t=localStorage.getItem('dr-theme');if(t){document.documentElement.dataset.theme=t}}catch(e){}</script>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

  /* screen skeleton (optional) */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f9fafb;
  --ink:#161b22; --muted:#5c6675; --border:#e4e8ee;
  --accent:#2f6fed; --accent-ink:#ffffff; --accent-weak:rgba(47,111,237,.10);
  --success:#1a9d5a; --danger:#d64545; --warning:#b7791f;
  --warning-bg:#fdf4e3; --warning-border:#eed9ad;
  --radius-card:10px; --radius-ctl:8px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  --sidebar-w:264px;
}
[data-theme="dark"]{
  --bg:#0e1116; --surface:#161b22; --surface-2:#1c222b;
  --ink:#e6e9ee; --muted:#9aa4b2; --border:#2a323d;
  --accent:#5b8cff; --accent-ink:#0e1116; --accent-weak:rgba(91,140,255,.16);
  --success:#3ddc84; --danger:#ff6b6b; --warning:#e0a458;
  --warning-bg:#241d10; --warning-border:#4a3a1c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,"Noto Sans SC",sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button{font:inherit}
svg{display:block}

.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}

/* ---------- sidebar ---------- */
.sidebar{
  position:sticky; top:0; align-self:start; height:100vh;
  background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; gap:16px; padding:20px 14px; z-index:20;
}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px}
.brand-mark{width:36px;height:36px;flex:none;border-radius:var(--radius-ctl);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand-name{display:block;font-size:15px;font-weight:650;line-height:1.3}
.brand-sub{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.dates{display:flex;flex-direction:column;gap:4px;flex:1;min-height:0;overflow-y:auto;padding:2px}
.dates-label{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding:4px 10px 2px;text-transform:uppercase}
.date-btn{
  appearance:none;border:1px solid transparent;background:transparent;color:var(--ink);
  text-align:left;border-radius:var(--radius-ctl);padding:9px 11px;cursor:pointer;
  display:grid;gap:2px;transition:background .16s ease,color .16s ease;
}
.date-btn:hover{background:var(--surface-2)}
.date-btn[aria-current="true"]{background:var(--accent-weak);color:var(--accent)}
.date-main{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.date-meta{display:block;font-size:12px;color:var(--muted)}
.date-btn[aria-current="true"] .date-meta{color:var(--accent);opacity:.85}
.sidebar-foot{padding:10px 8px 0;border-top:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.5}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  position:sticky;top:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:14px 24px;
}
.topbar-title{flex:1;min-width:0}
.topbar h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em}
.topbar-sub{margin:2px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.icon-btn{
  width:40px;height:40px;flex:none;display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:var(--radius-ctl);
  transition:background .16s ease,border-color .16s ease;
}
.icon-btn:hover{background:var(--surface-2)}
.menu-btn{display:none}

.content{padding:24px;max-width:1120px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:14px 16px;gap:2px}
.stat-value{font-size:26px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat-label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat-label svg{color:var(--accent)}

/* notice */
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--warning-bg);border:1px solid var(--warning-border);color:var(--warning);border-radius:var(--radius-card);padding:12px 14px;font-size:14px}
.notice svg{flex:none;margin-top:2px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);
  font-size:14px;border-radius:999px;padding:7px 14px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
  transition:background .16s ease,border-color .16s ease,color .16s ease;
}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip-count{font-size:12px;font-variant-numeric:tabular-nums;opacity:.75}

/* member card */
.member{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow);overflow:hidden}
.member-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.avatar{width:40px;height:40px;flex:none;border-radius:999px;display:grid;place-items:center;font-weight:600;font-size:15px;background:var(--accent-weak);color:var(--accent)}
.member-name{margin:0;font-size:16px;font-weight:600}
.member-meta{margin:2px 0 0;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}

.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.module{padding:16px 20px;border-right:1px solid var(--border);min-width:0}
.module:last-child{border-right:0}
.module-head{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.module-head svg{color:var(--muted);flex:none}
.module-title{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.module-count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:1px 8px}

.records{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.record{display:grid;gap:4px;min-width:0}
.record-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.repo{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:1px 7px;color:var(--muted)}
.record-title{font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.record-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap;font-variant-numeric:tabular-nums}

.diff-add{color:var(--success)}
.diff-del{color:var(--danger)}
.commit-link{color:inherit;text-decoration:none}
.commit-link:hover .commit-ext,.commit-link:hover{color:var(--accent);text-decoration:underline}
.commit-ext{font-size:12px;font-weight:400;color:var(--accent)}
.commit-files{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.commit-file{font-size:12px;font-weight:600}
.commit-fname{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
.commit-fname:hover{text-decoration:underline}
.commit-diff{margin-top:4px;padding:6px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;font-family:Consolas,Menlo,monospace;font-size:12px;line-height:1.7;font-weight:400;overflow-x:auto}
.commit-line{white-space:pre-wrap;word-break:break-all}
.commit-plus{color:var(--success)}
.commit-filelist{margin-top:6px;font-size:12px;color:var(--muted)}
.commit-filelist a{color:var(--accent);text-decoration:none}
.commit-filelist a:hover{text-decoration:underline}
.diff-add{color:var(--success)}.chat{font-size:12px;color:var(--accent);background:var(--accent-weak);border-radius:6px;padding:1px 7px;white-space:nowrap}
.empty{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.empty svg,.failed svg{flex:none}
.failed{display:flex;align-items:center;gap:8px;color:var(--danger);font-size:14px}

.page-foot{padding:10px 2px 2px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.5}

/* 明日计划卡片 */
.plan-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow);overflow:hidden}
.plan-head{display:flex;align-items:center;gap:8px;padding:14px 20px;border-bottom:1px solid var(--border)}
.plan-head svg{color:var(--accent);flex:none}
.plan-title{font-size:15px;font-weight:600}
.plan-count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:1px 8px}
.plan-list{list-style:none;margin:0;padding:10px 20px 4px;display:flex;flex-direction:column;gap:8px}
.plan-item{display:flex;align-items:flex-start;gap:8px;font-size:14px;line-height:1.55}
.plan-owner{flex:none;font-size:12px;color:var(--accent);background:var(--accent-weak);border-radius:6px;padding:1px 8px;white-space:nowrap;margin-top:1px}
.plan-text{flex:1;min-width:0;overflow-wrap:anywhere}
.plan-del{flex:none;width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:6px;cursor:pointer;font-size:12px;line-height:1}
.plan-del:hover{color:var(--danger);border-color:var(--danger)}
.plan-form{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px 16px}
.plan-input{flex:1;min-width:180px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);border-radius:var(--radius-ctl);padding:8px 12px;font:inherit;font-size:14px}
.plan-input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.plan-select{border:1px solid var(--border);background:var(--surface-2);color:var(--ink);border-radius:var(--radius-ctl);padding:8px 10px;font:inherit;font-size:14px;cursor:pointer}
.plan-add{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:var(--radius-ctl);padding:8px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.plan-add:hover{filter:brightness(1.06)}
.plan-empty{padding:14px 20px 4px;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}

/* 今日总结卡片（AI 摘要，复用 plan-* 基础样式） */
.summary-text{margin:0;padding:14px 20px 16px;font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}

/* 任务完成趋势卡片（近 7 个报告日的清单完成度堆叠柱） */
.trend-body{display:flex;align-items:flex-end;gap:12px;padding:16px 20px 18px;overflow-x:auto}
.trend-col{flex:1 1 0;min-width:44px;display:grid;justify-items:center;gap:6px}
.trend-val{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.trend-bar{display:flex;flex-direction:column-reverse;width:22px;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface)}
.trend-seg{display:block;width:100%}
.trend-seg.done{background:var(--success)}
.trend-seg.todo{background:var(--surface-2)}
.trend-day{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.trend-week{font-size:12px;color:var(--muted)}
.trend-col.today .trend-day{color:var(--accent)}

/* 问题与解决卡片（复用 plan-* 基础样式） */
.issue-status{flex:none;font-size:12px;border-radius:6px;padding:1px 8px;white-space:nowrap;margin-top:1px;border:1px solid transparent}
.issue-status.ok{color:#16a34a;background:rgba(22,163,74,.12)}
.issue-status.doing{color:#d97706;background:rgba(217,119,6,.12)}
.issue-solution{color:var(--muted)}
.issue-toggle:hover{color:var(--accent);border-color:var(--accent)}
.claim-item{display:block}
.claim-form{display:flex;flex-direction:column;gap:8px}
.claim-problem{font-size:14px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.claim-row{display:flex;flex-wrap:wrap;gap:8px}

/* focus */
:where(.icon-btn,.date-btn,.chip):focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* off-canvas nav */
.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;inset:0 auto 0 0;width:284px;height:100%;transform:translateX(-100%);transition:transform .24s ease-out;box-shadow:var(--shadow)}
  .app.nav-open .sidebar{transform:translateX(0)}
  .scrim{display:block;position:fixed;inset:0;z-index:30;background:rgba(10,14,20,.45);opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s ease}
  .app.nav-open .scrim{opacity:1;visibility:visible}
  .menu-btn{display:grid}
  .modules{grid-template-columns:minmax(0,1fr)}
  .module{border-right:0;border-bottom:1px solid var(--border)}
  .module:last-child{border-bottom:0}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:480px){
  .content{padding:16px;gap:16px}
  .topbar{padding:12px 16px}
  .topbar h1{font-size:16px}
  .stat-value{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="日报历史">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M8 10h8M8 14h5"/></svg>
      </span>
      <span>
        <span class="brand-name">研发一组</span>
        <span class="brand-sub">智能日报 · 看板</span>
      </span>
    </div>
    <p class="dates-label">日报历史</p>
    <nav class="dates" id="dateList" aria-label="按日期查看日报"></nav>
    <div class="sidebar-foot">数据来源：GitHub · 飞书任务 · 飞书消息</div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="打开日报日期列表" aria-expanded="false" aria-controls="sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar-title">
        <h1 id="pageTitle">研发一组 · 工作日报</h1>
        <p class="topbar-sub" id="pageSub"></p>
      </div>
      <button class="icon-btn" id="logoutBtn" type="button" aria-label="退出登录" title="退出登录">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切换到深色模式">
        <span id="themeIcon"></span>
      </button>
    </header>

    <div class="content">
      <section class="stats" id="stats" aria-label="当日概览"></section>
      <section id="trendCard" aria-label="任务完成趋势"></section>
      <div class="notice" id="notice" role="status" hidden></div>
      <div class="filters" id="filters" aria-label="按成员筛选"></div>
      <div class="members" id="members"></div>
      <section id="summaryCard" aria-label="今日总结"></section>
      <section id="taskCard" aria-label="今日任务清单"></section>
      <section id="planCard" aria-label="明日计划"></section>
      <section id="issueCard" aria-label="问题与解决"></section>
      <footer class="page-foot" id="pageFoot"></footer>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";

  /* --- 图标：单一线性描边图标族（1.6px 描边，圆角端点） --- */
  var PATHS = {
    branch: '<circle cx="6.5" cy="5.5" r="2.2"/><circle cx="6.5" cy="18.5" r="2.2"/><circle cx="17.5" cy="8.5" r="2.2"/><path d="M6.5 7.7v8.6M8.7 9.5h5.1a3.7 3.7 0 0 1 3.7 3.7v.5"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/>',
    chat: '<path d="M20.5 11.5a7.5 7.5 0 0 1-10.9 6.7L5 19.5l1.2-4.2A7.5 7.5 0 1 1 20.5 11.5Z"/>',
    calendar: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/>',
    users: '<circle cx="9.5" cy="8.5" r="3.2"/><path d="M3.8 19.5a5.7 5.7 0 0 1 11.4 0"/><path d="M16.5 6.2a3.2 3.2 0 0 1 0 5.9M17 19.5a5.9 5.9 0 0 0-1.5-3.9"/>',
    alert: '<circle cx="12" cy="12" r="9"/><path d="M12 8v4.5M12 16h.01"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    inbox: '<path d="M4.5 13.5h3.6l1.4 2.4h5l1.4-2.4h3.6"/><path d="M6 5.5h12l1.5 8v3.5a1.5 1.5 0 0 1-1.5 1.5H6a1.5 1.5 0 0 1-1.5-1.5V13.5Z"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>',
    moon: '<path d="M20.5 13.4A8.5 8.5 0 1 1 10.6 3.5a6.8 6.8 0 0 0 9.9 9.9Z"/>'
  };
  function icon(name, size) {
    size = size || 16;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      (PATHS[name] || "") + "</svg>";
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* 数据来源：静态导出时由后端注入数组字面量；--serve 模式下为 null，启动时 fetch 加载。
     结构对齐 shared/models.py 的 DailyReport / MemberReport。 */
  var REPORTS = __REPORTS_JSON__;
  var AUTO_REFRESH_INTERVAL = __AUTO_REFRESH_INTERVAL__;

  var SOURCES = {
    github: { key: "github", title: "github代码提交情况", icon: "branch" },
    lark_message: { key: "lark_message", title: "飞书SDD测试群协作沟通情况", icon: "chat" }
  };
  var SOURCE_LABELS = {
    github: "GitHub 代码提交",
    lark_task: "飞书任务清单",
    lark_message: "飞书消息"
  };

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var els = {
    app: $("#app"), dateList: $("#dateList"), stats: $("#stats"), notice: $("#notice"),
    trendCard: $("#trendCard"),
    filters: $("#filters"), members: $("#members"), taskCard: $("#taskCard"),
    summaryCard: $("#summaryCard"),
    planCard: $("#planCard"),
    issueCard: $("#issueCard"),
    pageTitle: $("#pageTitle"),
    pageSub: $("#pageSub"), pageFoot: $("#pageFoot"), themeBtn: $("#themeBtn"),
    themeIcon: $("#themeIcon"), menuBtn: $("#menuBtn"), scrim: $("#scrim"), sidebar: $("#sidebar"),
    logoutBtn: $("#logoutBtn")
  };

  var state = { date: __INITIAL_DATE__, member: "all" };

  function currentReport() {
    return REPORTS.filter(function (r) { return r.date === state.date; })[0] || REPORTS[0];
  }
  function weekday(iso, style) {
    return new Date(iso + "T00:00:00").toLocaleDateString("zh-CN", { weekday: style });
  }
  function totalRecords(m) { return m.commits.length + m.messages.length; }

  /* --- 侧栏：历史日期 --- */
  function renderDateList() {
    els.dateList.innerHTML = REPORTS.map(function (r) {
      var records = r.members.reduce(function (a, m) { return a + totalRecords(m); }, 0) +
        (r.task_list ? r.task_list.subtasks.length : 0);
      var current = r.date === state.date;
      return '<button class="date-btn" type="button" data-date="' + r.date + '"' +
        (current ? ' aria-current="true"' : "") + '>' +
        '<span class="date-main">' + r.date + "</span>" +
        '<span class="date-meta">' + weekday(r.date, "short") + " · " + r.members.length + " 人 · " + records + " 条</span>" +
        "</button>";
    }).join("");
  }

  /* --- 顶部信息 --- */
  function renderHeader(report) {
    els.pageTitle.textContent = report.members.length === 1
      ? report.members[0].name + "的智能日报"
      : report.team_name + " · 智能日报";
    els.pageSub.textContent = report.date + " " + weekday(report.date, "long") + " · 生成于 " + report.generated_at;
    els.pageFoot.innerHTML = "智能日报生成器 · 浏览器看板，数据来源：GitHub · 飞书任务 · 飞书消息。" +
      "<br>邮件通道使用项目原有的内联样式模板。";
  }

  /* --- 概览统计 --- */
  function renderStats(report) {
    var commits = 0, messages = 0, active = 0, legacyTasks = 0;
    report.members.forEach(function (m) {
      commits += m.commits.length; messages += m.messages.length;
      legacyTasks += (m.tasks || []).length;  // 旧数据回退：无 task_list 时沿用历史任务变更数
      if (totalRecords(m) > 0) active += 1;
    });
    var tasks = report.task_list ? report.task_list.subtasks.length : legacyTasks;
    var items = [
      { icon: "branch", label: "代码提交", value: commits },
      { icon: "check", label: "清单任务", value: tasks },
      { icon: "chat", label: "协作沟通", value: messages },
      { icon: "users", label: "活跃成员", value: active }
    ];
    els.stats.innerHTML = items.map(function (it) {
      return '<div class="stat od-stat">' +
        '<span class="stat-value">' + it.value + "</span>" +
        '<span class="stat-label">' + icon(it.icon, 15) + it.label + "</span>" +
        "</div>";
    }).join("");
  }

  /* --- 任务完成趋势（近 7 个报告日的清单完成度，前端聚合 /api/reports 已有数据） --- */
  function dayTaskStats(report) {
    var tl = report.task_list;
    if (tl && tl.subtasks && tl.subtasks.length) {
      return {
        done: tl.subtasks.filter(function (s) { return s.status_to === "已完成"; }).length,
        total: tl.subtasks.length
      };
    }
    var legacy = [];  // 旧数据回退：无 task_list 时沿用成员级任务变更记录
    (report.members || []).forEach(function (m) {
      (m.tasks || []).forEach(function (t) { legacy.push(t); });
    });
    if (!legacy.length) { return null; }
    return {
      done: legacy.filter(function (t) { return t.status_to === "已完成"; }).length,
      total: legacy.length
    };
  }
  function localIso(d) {
    var p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function renderTrend() {
    var days = [];  // REPORTS 按日期倒序；取最近 7 个有任务数据的报告日，正序展示
    for (var i = 0; i < REPORTS.length && days.length < 7; i++) {
      var st = dayTaskStats(REPORTS[i]);
      if (st && st.total) { days.push({ date: REPORTS[i].date, done: st.done, total: st.total }); }
    }
    days.reverse();
    var titleHtml = icon("check", 18) + '<span class="plan-title">任务完成趋势</span>';
    if (!days.length) {
      els.trendCard.innerHTML =
        '<div class="plan-card">' +
          '<div class="plan-head">' + titleHtml + '<span class="plan-count">近 7 天</span></div>' +
          '<p class="plan-empty">' + icon("inbox", 16) + "<span>暂无任务数据，任务清单采集后自动出现</span></p>" +
        "</div>";
      return;
    }
    var tDone = 0, tTotal = 0, maxTotal = 0;
    days.forEach(function (d) {
      tDone += d.done; tTotal += d.total;
      if (d.total > maxTotal) { maxTotal = d.total; }
    });
    var pct = tTotal ? Math.round((tDone / tTotal) * 100) : 0;
    var unit = 72 / Math.max(maxTotal, 1);  // 像素/任务，柱区最高 72px
    var todayIso = localIso(new Date());
    var cols = days.map(function (d) {
      var doneH = Math.round(d.done * unit);
      var todoH = Math.round(d.total * unit) - doneH;
      var isToday = d.date === todayIso;
      return '<div class="trend-col' + (isToday ? " today" : "") +
        '" title="' + esc(d.date) + "：完成 " + d.done + " / 共 " + d.total + '">' +
        '<span class="trend-val">' + d.done + "/" + d.total + "</span>" +
        '<span class="trend-bar" style="height:' + Math.round(d.total * unit) + 'px">' +
          '<span class="trend-seg todo" style="height:' + todoH + 'px"></span>' +
          '<span class="trend-seg done" style="height:' + doneH + 'px"></span>' +
        "</span>" +
        '<span class="trend-day">' + esc(d.date.slice(5)) + "</span>" +
        '<span class="trend-week">' + (isToday ? "今天" : weekday(d.date, "short")) + "</span>" +
        "</div>";
    }).join("");
    els.trendCard.innerHTML =
      '<div class="plan-card">' +
        '<div class="plan-head">' + titleHtml +
          '<span class="plan-count">' + days.length + " 天 · 完成率 " + pct + "%</span>" +
        "</div>" +
        '<div class="trend-body">' + cols + "</div>" +
      "</div>";
  }

  /* --- 数据源失败提示 --- */
  function renderNotice(report) {
    if (!report.failed_sources.length) { els.notice.hidden = true; els.notice.innerHTML = ""; return; }
    var labels = report.failed_sources.map(function (s) { return SOURCE_LABELS[s] || s; }).join("、");
    els.notice.hidden = false;
    els.notice.innerHTML = icon("alert", 18) + "<span>以下数据源本次采集失败，对应板块已显式标注：<strong>" + esc(labels) + "</strong></span>";
  }

  /* --- 成员筛选 --- */
  function renderFilters(report) {
    var names = report.members.map(function (m) { return m.name; });
    if (state.member !== "all" && names.indexOf(state.member) === -1) state.member = "all";

    var total = report.members.reduce(function (a, m) { return a + totalRecords(m); }, 0);
    var chips = [{ id: "all", label: "全部成员", count: total }].concat(report.members.map(function (m) {
      return { id: m.name, label: m.name, count: totalRecords(m) };
    }));
    els.filters.innerHTML = chips.map(function (c) {
      var pressed = state.member === c.id;
      return '<button class="chip" type="button" data-member="' + esc(c.id) + '" aria-pressed="' + pressed + '">' +
        esc(c.label) + '<span class="chip-count">' + c.count + "</span></button>";
    }).join("");
  }

  /* --- 单条记录渲染 --- */
  function commitItem(c) {
    var title = c.url
      ? '<a class="commit-link" href="' + esc(c.url) + '" target="_blank" rel="noopener">' +
        esc(c.message) + ' <span class="commit-ext">查看提交 ↗</span></a>'
      : esc(c.message);
    var filesHtml = "";
    if (c.files && c.files.length) {
      var inline = c.files.some(function (f) { return f.added && f.added.length; });
      if (inline) {
        filesHtml = '<div class="commit-files">' + c.files.map(function (f) {
          var name = f.url
            ? '<a class="commit-fname" href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.filename) + "</a>"
            : '<span class="commit-fname">' + esc(f.filename) + "</span>";
          var lines = (f.added || []).map(function (ln) {
            return '<div class="commit-line"><span class="commit-plus">+</span> ' + esc(ln) + "</div>";
          }).join("");
          return '<div class="commit-file">📄 ' + name +
            ' <span class="diff-add">+' + f.additions + '</span><span class="diff-del">−' + f.deletions + "</span>" +
            (lines ? '<div class="commit-diff">' + lines + "</div>" : "") + "</div>";
        }).join("") + "</div>";
      } else {
        filesHtml = '<div class="commit-filelist">改动较大，查看文件：' + c.files.map(function (f) {
          return f.url
            ? '<a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.filename) + "</a>"
            : esc(f.filename);
        }).join(" · ") + "</div>";
      }
    }
    return '<li class="record">' +
      '<div class="record-top"><span class="repo">' + esc(c.repo) + "</span></div>" +
      '<span class="record-title">' + title + "</span>" +
      '<div class="record-meta">' +
        '<span class="diff-add">+' + c.additions + "</span>" +
        '<span class="diff-del">−' + c.deletions + "</span>" +
        "<span>" + c.files_changed + " 个文件</span>" +
        '<span class="time">' + esc(c.time) + "</span>" +
      "</div>" + filesHtml + "</li>";
  }
  function messageItem(m, idx) {
    return '<li class="record">' +
      '<div class="record-top"><span class="chat">沟通记录' + (idx + 1) + '</span><span class="time" style="font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums">' + esc(m.time) + "</span></div>" +
      '<span class="record-title">' + esc(m.content) + "</span>" +
      "</li>";
  }

  /* --- 单个数据源板块 --- */
  function module(source, member, report) {
    var s = SOURCES[source];
    var failed = report.failed_sources.indexOf(source) !== -1;
    var body, count = "";
    var records = source === "github" ? member.commits : member.messages;

    if (failed) {
      body = '<p class="failed">' + icon("alert", 16) + "<span>数据获取失败</span></p>";
    } else if (source === "github" && !member.github_username) {
      body = '<p class="empty">' + icon("info", 16) + "<span>未绑定 GitHub 账号</span></p>";
    } else if (!records.length) {
      body = '<p class="empty">' + icon("inbox", 16) + "<span>今日无记录</span></p>";
    } else {
      count = '<span class="module-count">' + records.length + "</span>";
      var render = source === "github" ? commitItem : messageItem;
      body = '<ul class="records">' + records.map(render).join("") + "</ul>";
    }

    return '<section class="module" aria-label="' + s.title + '">' +
      '<div class="module-head">' + icon(s.icon, 16) + '<span class="module-title">' + s.title + "</span>" + count + "</div>" +
      body + "</section>";
  }

  /* --- 成员卡片 --- */
  function memberCard(m, report) {
    var meta = m.github_username
      ? "<span>GitHub · " + esc(m.github_username) + "</span>"
      : "<span>未绑定 GitHub</span>";
    meta += "<span>" + totalRecords(m) + " 条记录</span>";
    return '<article class="member">' +
      '<header class="member-head">' +
        '<span class="avatar" aria-hidden="true">' + esc(m.name.slice(0, 1)) + "</span>" +
        "<div>" +
          '<h2 class="member-name">' + esc(m.name) + "</h2>" +
          '<p class="member-meta">' + meta + "</p>" +
        "</div>" +
      "</header>" +
      '<div class="modules">' +
        module("github", m, report) +
        module("lark_message", m, report) +
      "</div></article>";
  }

  function renderMembers(report) {
    var list = report.members.filter(function (m) { return state.member === "all" || m.name === state.member; });
    els.members.innerHTML = list.map(function (m) { return memberCard(m, report); }).join("");
  }

  /* --- 今日任务清单卡片（团队级，来自飞书 M月D日任务清单） --- */
  function renderTaskCard(report) {
    var tl = report.task_list;
    var failed = tl === null && report.failed_sources.indexOf("lark_task") !== -1;
    var head =
      '<div class="plan-head">' + icon("check", 18) +
        '<span class="plan-title">今日任务清单</span>' +
        (tl && tl.progress ? '<span class="plan-count">' + esc(tl.progress) + " 已完成</span>" : "") +
      "</div>";
    var body;
    if (tl && tl.subtasks.length) {
      body = '<ul class="plan-list">' + tl.subtasks.map(function (s) {
        var ok = s.status_to === "已完成";
        return '<li class="plan-item">' +
          '<span class="plan-text">' + (ok ? "✅ " : "⬜ ") + esc(s.title) + "</span>" +
          (ok ? '<span class="issue-status ok">已完成</span>' : "") +
          "</li>";
      }).join("") + "</ul>";
    } else if (failed) {
      body = '<p class="plan-empty">' + icon("alert", 16) + "<span>任务清单数据获取失败</span></p>";
    } else {
      body = '<p class="plan-empty">' + icon("inbox", 16) +
        "<span>暂无任务，在群里发「明天：要做的任务」即可自动布置</span></p>";
    }
    els.taskCard.innerHTML = '<div class="plan-card">' + head + body + "</div>";
  }

  /* --- 明日计划卡片 --- */
  function planItem(p) {
    var delBtn = p.source === "manual" && p.id
      ? '<button class="plan-del" type="button" data-id="' + p.id + '" aria-label="删除该计划">✕</button>'
      : "";
    return '<li class="plan-item">' +
      '<span class="plan-text">' + esc(p.title) + "</span>" +
      delBtn + "</li>";
  }
  function renderPlans(report) {
    var plans = report.tomorrow_plans || [];
    var prevInput = $("#planInput");
    var prevText = prevInput ? prevInput.value : "";
    var body = plans.length
      ? '<ul class="plan-list">' + plans.map(planItem).join("") + "</ul>"
      : '<p class="plan-empty">' + icon("inbox", 16) + "<span>暂无明日计划，可在下方添加</span></p>";
    var options = report.members.map(function (m) {
      return '<option value="' + esc(m.name) + '">' + esc(m.name) + "</option>";
    }).join("");
    els.planCard.innerHTML =
      '<div class="plan-card">' +
        '<div class="plan-head">' + icon("calendar", 18) +
          '<span class="plan-title">明日计划</span>' +
          '<span class="plan-count">' + plans.length + " 项</span>" +
        "</div>" +
        body +
        '<form class="plan-form" id="planForm">' +
          '<input class="plan-input" id="planInput" type="text" maxlength="100" placeholder="添加明天要做的事…" aria-label="计划内容">' +
          '<select class="plan-select" id="planOwner" aria-label="负责人">' + options + "</select>" +
          '<button class="plan-add" type="submit">添加</button>' +
        "</form>" +
      "</div>";
    if (prevText) { $("#planInput").value = prevText; }
  }

  /* --- 问题与解决卡片 --- */
  var claimKey = "";  // 处于「补充方案」编辑态的自动条目 msg_key

  function claimForm(it) {
    var ok = it.status === "已解决";
    return '<li class="plan-item claim-item">' +
      '<form class="claim-form" id="issueClaimForm">' +
        '<span class="claim-problem">' + esc(it.problem) + "</span>" +
        '<div class="claim-row">' +
          '<input class="plan-input" id="issueClaimSolution" type="text" maxlength="100" placeholder="解决方案" aria-label="解决方案" value="' + esc(it.solution || "") + '">' +
          '<select class="plan-select" id="issueClaimStatus" aria-label="状态">' +
            '<option value="处理中"' + (ok ? "" : " selected") + ">⏳ 处理中</option>" +
            '<option value="已解决"' + (ok ? " selected" : "") + ">✅ 已解决</option>" +
          "</select>" +
          '<button class="plan-add issue-claim-save" type="submit">保存</button>' +
          '<button class="plan-del issue-claim-cancel" type="button">取消</button>' +
        "</div>" +
      "</form></li>";
  }
  function issueItem(it) {
    var ok = it.status === "已解决";
    var status = '<span class="issue-status ' + (ok ? "ok" : "doing") + '">' +
      (ok ? "✅ 已解决" : "⏳ 处理中") + "</span>";
    var text = esc(it.problem) +
      (it.solution ? '<span class="issue-solution"> → ' + esc(it.solution) + "</span>" : "");
    var ops = "";
    if (it.source === "manual" && it.id) {
      var next = ok ? "处理中" : "已解决";
      ops =
        '<button class="plan-del issue-toggle" type="button" data-id="' + it.id +
          '" data-status="' + next + '" aria-label="' + (ok ? "标记为处理中" : "标记为已解决") + '">' +
          (ok ? "↩" : "✔") + "</button>" +
        '<button class="plan-del" type="button" data-id="' + it.id + '" aria-label="删除该问题">✕</button>';
    } else if (it.source !== "manual" && it.msg_key) {
      ops = '<button class="plan-del issue-claim" type="button" data-key="' + esc(it.msg_key) +
        '" aria-label="补充解决方案">补充方案</button>';
    }
    return '<li class="plan-item">' +
      '<span class="plan-text">' + text + "</span>" +
      status + ops + "</li>";
  }
  function renderIssues(report) {
    var issues = report.issues || [];
    var prevProblem = $("#issueProblem"), prevSolution = $("#issueSolution"), prevOwner = $("#issueOwnerSel");
    var prevP = prevProblem ? prevProblem.value : "";
    var prevS = prevSolution ? prevSolution.value : "";
    var prevO = prevOwner ? prevOwner.value : "";
    // 认领表单在轮询重渲染间保留已填内容（同主表单策略）
    var prevClaimS = "", prevClaimSt = "";
    if (claimKey) {
      var pcS = $("#issueClaimSolution"), pcSt = $("#issueClaimStatus");
      if (pcS) { prevClaimS = pcS.value; }
      if (pcSt) { prevClaimSt = pcSt.value; }
    }
    var body = issues.length
      ? '<ul class="plan-list">' + issues.map(function (it) {
          return (claimKey && it.msg_key === claimKey) ? claimForm(it) : issueItem(it);
        }).join("") + "</ul>"
      : '<p class="plan-empty">' + icon("alert", 16) + "<span>今日暂无问题记录，可在下方添加</span></p>";
    var options = report.members.map(function (m) {
      return '<option value="' + esc(m.name) + '">' + esc(m.name) + "</option>";
    }).join("");
    els.issueCard.innerHTML =
      '<div class="plan-card">' +
        '<div class="plan-head">' + icon("alert", 18) +
          '<span class="plan-title">问题与解决</span>' +
          '<span class="plan-count">' + issues.length + " 项</span>" +
        "</div>" +
        body +
        '<form class="plan-form" id="issueForm">' +
          '<input class="plan-input" id="issueProblem" type="text" maxlength="100" placeholder="遇到的问题…" aria-label="问题描述">' +
          '<input class="plan-input" id="issueSolution" type="text" maxlength="100" placeholder="解决方案（可选）" aria-label="解决方案">' +
          '<select class="plan-select" id="issueOwnerSel" aria-label="负责人">' + options + "</select>" +
          '<button class="plan-add" type="submit">添加</button>' +
        "</form>" +
      "</div>";
    if (prevP) { $("#issueProblem").value = prevP; }
    if (prevS) { $("#issueSolution").value = prevS; }
    if (prevO) { $("#issueOwnerSel").value = prevO; }
    if (claimKey) {
      var cS = $("#issueClaimSolution"), cSt = $("#issueClaimStatus");
      if (cS && prevClaimS) { cS.value = prevClaimS; }
      if (cSt && prevClaimSt) { cSt.value = prevClaimSt; }
    }
  }

  /* --- 今日总结卡片（AI 摘要，空则不渲染） --- */
  function renderSummary(report) {
    var s = (report.summary || "").trim();
    els.summaryCard.innerHTML = s
      ? '<div class="plan-card">' +
          '<div class="plan-head">' + icon("info", 18) +
            '<span class="plan-title">今日总结</span>' +
            '<span class="plan-count">AI 生成</span>' +
          "</div>" +
          '<p class="summary-text">' + esc(s) + "</p>" +
        "</div>"
      : "";
  }

  function renderAll() {
    var report = currentReport();
    renderDateList();
    renderHeader(report);
    renderStats(report);
    renderTrend();
    renderNotice(report);
    renderFilters(report);
    renderMembers(report);
    renderSummary(report);
    renderTaskCard(report);
    renderPlans(report);
    renderIssues(report);
  }

  /* --- 主题 --- */
  function paintTheme() {
    var dark = document.documentElement.dataset.theme === "dark";
    els.themeIcon.innerHTML = icon(dark ? "sun" : "moon", 20);
    els.themeBtn.setAttribute("aria-label", dark ? "切换到浅色模式" : "切换到深色模式");
  }
  els.themeBtn.addEventListener("click", function () {
    var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("dr-theme", next); } catch (e) {}
    paintTheme();
  });

  els.logoutBtn.addEventListener("click", function () {
    fetch("api/auth/logout", { method: "POST" })
      .catch(function () {})
      .finally(function () { location.href = "/login"; });
  });

  /* --- 抽屉导航 --- */
  function setNav(open) {
    els.app.classList.toggle("nav-open", open);
    els.scrim.hidden = !open;
    els.menuBtn.setAttribute("aria-expanded", String(open));
  }
  els.menuBtn.addEventListener("click", function () {
    setNav(!els.app.classList.contains("nav-open"));
  });
  els.scrim.addEventListener("click", function () { setNav(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") setNav(false);
  });

  /* --- 事件委托 --- */
  els.dateList.addEventListener("click", function (e) {
    var btn = e.target.closest(".date-btn");
    if (!btn) return;
    state.date = btn.getAttribute("data-date");
    renderAll();
    setNav(false);
  });
  els.filters.addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (!chip) return;
    state.member = chip.getAttribute("data-member");
    renderFilters(currentReport());
    renderMembers(currentReport());
  });
  /* 明日计划：添加 / 删除（乐观更新：改本地数据立即重渲染，下一轮自动刷新与服务端同步） */
  els.planCard.addEventListener("submit", function (e) {
    var form = e.target.closest("#planForm");
    if (!form) return;
    e.preventDefault();
    var input = $("#planInput");
    var title = (input && input.value || "").trim();
    if (!title) { return; }
    var owner = $("#planOwner").value;
    fetch("api/plans", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: title, owner: owner })
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data && data.code === 0) {
        var report = currentReport();
        report.tomorrow_plans = (report.tomorrow_plans || []).concat([{
          title: title, owner: owner, source: "manual", id: data.id
        }]);
        if (input) { input.value = ""; }
        renderPlans(report);
      }
    }).catch(function () { /* 静默等下一轮 */ });
  });
  els.planCard.addEventListener("click", function (e) {
    var btn = e.target.closest(".plan-del");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    if (!id) return;
    fetch("api/plans?id=" + encodeURIComponent(id), { method: "DELETE" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.code === 0) {
          var report = currentReport();
          report.tomorrow_plans = (report.tomorrow_plans || []).filter(function (p) {
            return !(p.source === "manual" && p.id === Number(id));
          });
          renderPlans(report);
        }
      })
      .catch(function () { /* 静默等下一轮 */ });
  });

  /* 问题与解决：认领补充方案 / 添加 / 状态切换 / 删除（乐观更新，同明日计划模式） */
  els.issueCard.addEventListener("submit", function (e) {
    var claimFormEl = e.target.closest("#issueClaimForm");
    if (claimFormEl) {
      e.preventDefault();
      var src = (currentReport().issues || []).find(function (x) {
        return x.msg_key === claimKey;
      });
      if (!src) { claimKey = ""; renderIssues(currentReport()); return; }
      var solution = ($("#issueClaimSolution") && $("#issueClaimSolution").value || "").trim();
      var status = $("#issueClaimStatus") ? $("#issueClaimStatus").value : "处理中";
      fetch("api/issues", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          problem: src.problem, solution: solution, owner: src.owner,
          status: status, msg_key: src.msg_key
        })
      }).then(function (r) { return r.json(); }).then(function (data) {
        if (data && data.code === 0) {
          var report = currentReport();
          report.issues = (report.issues || [])
            .filter(function (x) { return x.msg_key !== claimKey; })
            .concat([{
              problem: src.problem, solution: solution, owner: src.owner,
              status: status, source: "manual", id: data.id, msg_key: src.msg_key
            }]);
          claimKey = "";
          renderIssues(report);
        }
      }).catch(function () { /* 静默等下一轮 */ });
      return;
    }
    var form = e.target.closest("#issueForm");
    if (!form) return;
    e.preventDefault();
    var pInput = $("#issueProblem"), sInput = $("#issueSolution");
    var problem = (pInput && pInput.value || "").trim();
    if (!problem) { return; }
    var solution = (sInput && sInput.value || "").trim();
    var owner = $("#issueOwnerSel").value;
    fetch("api/issues", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ problem: problem, solution: solution, owner: owner })
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data && data.code === 0) {
        var report = currentReport();
        report.issues = (report.issues || []).concat([{
          problem: problem, solution: solution, owner: owner,
          status: "处理中", source: "manual", id: data.id
        }]);
        if (pInput) { pInput.value = ""; }
        if (sInput) { sInput.value = ""; }
        renderIssues(report);
      }
    }).catch(function () { /* 静默等下一轮 */ });
  });
  els.issueCard.addEventListener("click", function (e) {
    var claimBtn = e.target.closest(".issue-claim");
    if (claimBtn) {
      claimKey = claimBtn.getAttribute("data-key") || "";
      renderIssues(currentReport());
      return;
    }
    if (e.target.closest(".issue-claim-cancel")) {
      claimKey = "";
      renderIssues(currentReport());
      return;
    }
    var toggle = e.target.closest(".issue-toggle");
    if (toggle) {
      var tid = toggle.getAttribute("data-id");
      var status = toggle.getAttribute("data-status");
      fetch("api/issues?id=" + encodeURIComponent(tid), {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: status })
      }).then(function (r) { return r.json(); }).then(function (data) {
        if (data && data.code === 0) {
          var report = currentReport();
          report.issues = (report.issues || []).map(function (it) {
            return (it.source === "manual" && it.id === Number(tid))
              ? { problem: it.problem, solution: it.solution, owner: it.owner,
                  status: status, source: it.source, id: it.id }
              : it;
          });
          renderIssues(report);
        }
      }).catch(function () { /* 静默等下一轮 */ });
      return;
    }
    var btn = e.target.closest(".plan-del");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    if (!id) return;
    fetch("api/issues?id=" + encodeURIComponent(id), { method: "DELETE" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.code === 0) {
          var report = currentReport();
          report.issues = (report.issues || []).filter(function (it) {
            return !(it.source === "manual" && it.id === Number(id));
          });
          renderIssues(report);
        }
      })
      .catch(function () { /* 静默等下一轮 */ });
  });

  var lastFingerprint = "";

  function applyReports(reports) {
    REPORTS = reports;
    lastFingerprint = JSON.stringify(reports);
    if (!state.date) { state.date = REPORTS[0].date; }
    renderAll();
  }

  function startPolling() {
    if (!AUTO_REFRESH_INTERVAL) { return; }  // 0 = 静态导出/已关闭，不轮询
    setInterval(function () {
      if (document.hidden) { return; }
      fetch("api/reports")
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var reports = (data && data.reports) || [];
          if (!reports.length) { return; }
          var fingerprint = JSON.stringify(reports);
          if (fingerprint === lastFingerprint) { return; }
          REPORTS = reports;
          lastFingerprint = fingerprint;
          var stillExists = REPORTS.some(function (r) { return r.date === state.date; });
          if (!stillExists) { state.date = REPORTS[0].date; }
          renderAll();
        })
        .catch(function () { /* 本轮失败，静默等下一轮 */ });
    }, AUTO_REFRESH_INTERVAL * 1000);
  }

  function boot() {
    paintTheme();
    if (REPORTS === null) {
      fetch("api/reports")
        .then(function (r) { return r.json(); })
        .then(function (data) {
          REPORTS = (data && data.reports) || [];
          if (!REPORTS.length) {
            els.members.innerHTML = '<p class="empty">暂无日报数据</p>';
            return;
          }
          applyReports(REPORTS);
          startPolling();
        })
        .catch(function () {
          els.members.innerHTML = '<p class="failed">日报数据加载失败</p>';
        });
    } else {
      if (!state.date) { state.date = REPORTS[0].date; }
      renderAll();
    }
  }
  boot();
})();
</script>
</body>
</html>
